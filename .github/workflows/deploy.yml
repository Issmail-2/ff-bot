name: Deploy ff-bot to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy-ff-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Issmail-2/ff-bot'
    steps:
      - name: Check Railway credentials are present
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set on this repository."
            echo "Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Create a token at: https://railway.com/account/tokens (Project scope for ff-bot)"
            exit 1
          fi
          echo "RAILWAY_TOKEN is present (${#RAILWAY_TOKEN} chars)"

      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # -s silently retries and -v streams logs, so a failure is diagnosable
      # from the run log instead of just "exit code 1".
      - name: Link project
        run: railway link -s --project "sincere-cooperation" --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy ff-bot
        run: railway up --ci --service ff-bot
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
